# Звичайний нешифрований listener — щоб показати, що на ньому TLS-клієнт теж не допомагає без налаштованого TLS,
# і що спроба підключитись БЕЗ TLS до TLS-порту не проходить.
listener 1883 127.0.0.1
allow_anonymous true

listener 8883 127.0.0.1
cafile /home/claude/iot_security/certs/ca.crt
certfile /home/claude/iot_security/certs/server.crt
keyfile /home/claude/iot_security/certs/server.key
allow_anonymous true

log_dest stdout
